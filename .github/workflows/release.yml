name: Release

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y cmake zlib1g-dev libpcre2-dev python3-dev \
            libmeshoptimizer-dev libtinygltf-dev patchelf

      - name: Configure CMake
        run: cmake -DCMAKE_BUILD_TYPE=Release -DBUNDLE_WOWS_DEPACK=ON .

      - name: Build
        run: make

      - name: Package
        run: bash misc/linux-dist.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: wows-model-exporter-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    env:
      BUILD_TYPE: Release
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg_installed
            deps/vcpkg/downloads
            deps/vcpkg/buildtrees
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: deps\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
            -DBUILD_TESTS=OFF `
            -DBUNDLE_WOWS_DEPACK=ON `
            -DBUNDLE_TINYGLTF=ON

      - name: Build
        run: cmake --build build --config $env:BUILD_TYPE

      - name: Package
        shell: pwsh
        run: .\scripts\package_windows.ps1 -Config $env:BUILD_TYPE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: wows-model-exporter-windows-x86_64.zip
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Publish versioned release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/wows-model-exporter-linux-x86_64.tar.gz
            artifacts/wows-model-exporter-windows-x86_64.zip

      - name: Publish latest pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main branch)
          prerelease: true
          make_latest: false
          files: |
            artifacts/wows-model-exporter-linux-x86_64.tar.gz
            artifacts/wows-model-exporter-windows-x86_64.zip

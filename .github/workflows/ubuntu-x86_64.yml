name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    runs-on: ubuntu-slim
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install packages
      run: |
        sudo apt update
        sudo apt install cmake zlib1g-dev libpcre2-dev clang lcov libcunit1-dev valgrind \
          libmeshoptimizer-dev libtinygltf-dev libstb-dev python3-dev
    - name: Fetch missing STB headers
      run: |
        sudo mkdir -p /usr/include/stb
        for f in stb_image_resize2.h stb_image_write.h; do
          [ -f /usr/include/stb/$f ] || sudo curl -fsSL \
            "https://raw.githubusercontent.com/nothings/stb/master/$f" \
            -o /usr/include/stb/$f
        done
    - name: Configure CMake
      run: cmake -DCOVERAGE=ON -DBUILD_TESTS=ON .
    - name: Build
      run: make
    - name: Coverage
      run: make test
    - name: Test
      run: make coverage
    - name: Memory checks
      run: valgrind --tool=memcheck --leak-check=yes --show-reachable=yes --num-callers=20 --track-fds=yes --track-origins=yes --error-exitcode=42 ./wows-geometry-test

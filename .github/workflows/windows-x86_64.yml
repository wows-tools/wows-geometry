name: Windows x86_64

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg_installed
            deps/vcpkg/downloads
            deps/vcpkg/buildtrees
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: deps\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
            -DBUILD_TESTS=OFF `
            -DBUNDLE_WOWS_DEPACK=ON `
            -DBUNDLE_TINYGLTF=ON

      - name: Build
        run: cmake --build build --config $env:BUILD_TYPE

      - name: Package
        shell: pwsh
        run: .\scripts\package_windows.ps1 -Config $env:BUILD_TYPE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wows-model-exporter-${{ github.ref_name }}-win64
          path: wows-model-exporter-windows-x86_64.zip
          if-no-files-found: error
